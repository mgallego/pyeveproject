[project]
name = "pyeveproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Moises Gallego" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "ruff>=0.16.3",
]

[project.scripts]
pyeveproject = "pyeveproject:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
